# Builds the desktop installers on every push to main and publishes them together as one
# GitHub Release of this repo:
#   - Windows: Bubble-Studio-Setup-<version>.exe (+ latest.yml, read by installed apps to update)
#   - macOS Apple Silicon: Bubble-Studio-<version>-arm64.dmg (+ zip and latest-mac.yml)
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count commits
      # major.minor from the VERSION file, patch = commits since VERSION last changed. The web
      # build numbers itself the same way (next.config.ts), so web and installers always match.
      - id: v
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          since=$(git log -1 --format=%H -- VERSION)
          echo "version=$base.$(git rev-list --count $since..HEAD)" >> "$GITHUB_OUTPUT"

  # Nothing is built or published unless types, lint and the end-to-end tests pass.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx next typegen && npx tsc --noEmit -p . # typegen: route types (LayoutProps) live in .next
      - name: Lint
        run: npm run lint
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7

  build:
    needs: [version, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:dist
            name: windows
          - os: macos-latest # Apple Silicon runner
            script: desktop:dist:mac
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix desktop ci

      - name: Set version
        run: npm --prefix desktop version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release notes: this version's entry from changelog.json (web and desktop share it), plus downloads.
      - name: Release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          {
            node scripts/changelog.mjs --notes "$(tr -d '[:space:]' < VERSION)"
            echo
            echo "### Download"
            echo
            echo "**Windows:** \`Bubble-Studio-Setup-$V.exe\`. Installed copies update themselves."
            echo
            echo "**Mac (Apple Silicon: M1, M2, M3):** \`Bubble-Studio-$V-arm64.dmg\`. Open it and drag Bubble Studio into Applications. The first time, right-click the app and choose **Open**."
            echo
            echo "The web app at the same commit shows the same version, $V. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
            echo
            echo "Made by Harindu Jayakody, a product of [Infiax.com](https://infiax.com). Built from ${{ github.sha }}."
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Bubble Studio ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
