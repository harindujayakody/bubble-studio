# Builds the Windows installer on every push to main and publishes it as a GitHub Release of
# this repo. Installed copies of Bubble Studio read these releases to update themselves.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built-in token needs write access to create releases.
permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix desktop ci

      # Every run gets a newer version (major.minor from desktop/package.json, patch = run number),
      # which is how installed apps know an update exists.
      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./desktop/package.json').version.split('.').slice(0,2).join('.')")
          version="$base.${{ github.run_number }}"
          npm --prefix desktop version "$version" --no-git-tag-version
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and publish release
        run: npm run desktop:release

      - name: Attach installer to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Studio-Setup-${{ env.VERSION }}
          path: |
            dist-desktop/*.exe
            dist-desktop/latest.yml
          if-no-files-found: ignore
          retention-days: 30
