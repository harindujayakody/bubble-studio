# Builds the Windows installer on every push to main and publishes it as a GitHub Release
# in the public releases repo, which installed copies of Bubble Studio check for updates.
#
# One-time setup (see README "Desktop app"):
#   1. Create the public repo harindujayakody/bubble-studio-releases (empty is fine).
#   2. Create a fine-grained token with "Contents: Read and write" on that repo and add it here
#      as the Actions secret RELEASES_TOKEN.
# Without the secret, the installer is still built and attached to the workflow run.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix desktop ci

      # Every run gets a newer version (major.minor from desktop/package.json, patch = run number),
      # which is how installed apps know an update exists.
      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./desktop/package.json').version.split('.').slice(0,2).join('.')")
          version="$base.${{ github.run_number }}"
          npm --prefix desktop version "$version" --no-git-tag-version
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and publish release
        if: env.GH_TOKEN != ''
        run: npm run desktop:release

      - name: Build installer (no release token set)
        if: env.GH_TOKEN == ''
        run: npm run desktop:dist

      - name: Attach installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Studio-Setup-${{ env.VERSION }}
          path: |
            dist-desktop/*.exe
            dist-desktop/latest.yml
          retention-days: 30
