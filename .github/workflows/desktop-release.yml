# Builds the Windows installer on every push to main and publishes it as a GitHub Release of
# this repo. Installed copies of Bubble Studio read these releases (latest.yml) to update themselves.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built-in token needs write access to create releases.
permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix desktop ci

      # Every run gets a newer version (major.minor from desktop/package.json, patch = run number),
      # which is how installed apps know an update exists.
      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./desktop/package.json').version.split('.').slice(0,2).join('.')")
          version="$base.${{ github.run_number }}"
          npm --prefix desktop version "$version" --no-git-tag-version
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # electron-builder only builds here; the release step below uploads everything in one go.
      - name: Build installer
        run: npm run desktop:dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Bubble Studio ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Built from ${{ github.sha }}.

            Download **Bubble-Studio-Setup-${{ env.VERSION }}.exe** to install. Installed copies update themselves.
          files: |
            dist-desktop/Bubble-Studio-Setup-${{ env.VERSION }}.exe
            dist-desktop/Bubble-Studio-Setup-${{ env.VERSION }}.exe.blockmap
            dist-desktop/latest.yml
