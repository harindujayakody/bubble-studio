# Windows installer for Bubble Studio. Build with `npm run desktop:dist`.
appId: com.harindujayakody.bubblestudio
productName: Bubble Studio
copyright: Copyright © Harindu Jayakody

directories:
  app: desktop          # two-package layout: only the shell + static web build are packaged
  output: dist-desktop
  buildResources: public

files:
  - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/favicon.png
  artifactName: Bubble-Studio-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Bubble Studio
  deleteAppDataOnUninstall: false

# Installers and update metadata are published as GitHub Releases of this (public) repo,
# which installed apps read to find updates.
publish:
  provider: github
  owner: harindujayakody
  repo: bubble-studio
  releaseType: release
